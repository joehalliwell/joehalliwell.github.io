# options specified here will apply to all posts in this folder

# Draft by default
draft: true

# freeze computational output
# (see https://quarto.org/docs/projects/code-execution.html#freeze)
freeze: true

# Enable banner style title blocks
title-block-banner: true

# Gives every post a byline, and fills in dc:creator in the feed and the
# article:author Open Graph tag.
author: Joe Halliwell


# Figures range right so an image's right edge meets the caption column beside
# it, whatever the image's width. Centring only lined the two up when the image
# happened to fill the measure.
fig-align: center
fig-cap-location: margin
reference-location: margin
