project:
  type: website
  output-dir: build

  # Only these get rendered. Without an explicit list Quarto also picks up
  # markdown inside the vendored reveal.js decks and renders over the real
  # pages, e.g. online-hadoop/plugin/markdown/example.md.
  render:
    - "*.qmd"
    - "posts/"

  # The theme's @font-face rules point at /assets/fonts/. Quarto only copies
  # files it can see referenced from the rendered HTML, and these are referenced
  # from inside the compiled bootstrap CSS, which it does not scan -- so without
  # this the site ships with no webfont and silently falls back to Georgia.
  resources:
    - assets/**

  post-render:
    # Pages that predate Quarto live in _legacy/ and are copied to the root of
    # the build, which is where their URLs have always been.
    - _scripts/copy-legacy.sh
    - _scripts/make-blog-redirects.sh
    # Runs last: it needs both the legacy pages and the redirect stubs in place
    # to decide what belongs in the sitemap and what gets a canonical link.
    - _scripts/add-seo-metadata.sh

website:
  title: "Joe Halliwell"

  # Used as the fallback <meta name="description"> and og:description for any
  # page without its own. Pages that deserve a specific one set `description:`.
  description: |
    Essays and notes by Joe Halliwell on AI architecture and safety, machine
    learning, programming, and whatever else seems interesting at the time.

  # Default social card image, used by pages that don't set their own. The
  # leading slash matters: a bare filename is resolved against the page, so
  # posts would advertise /posts/profile.jpg and scrapers would get a 404.
  # Portrait rather than the 1200x630 the scrapers prefer, so it gets cropped.
  image: /profile.jpg

  # Without these a link to a post shared anywhere -- Mastodon, LinkedIn, Slack
  # -- unfurls as a bare URL with no title, blurb or image.
  open-graph: true
  twitter-card: true

  navbar:
    right:
      - about.qmd
      - text: "Github"
        # icon: github
        href: https://github.com/joehalliwell
      - text: "Mastodon"
        # icon: mastodon
        href: https://mastodon.social/@joehalliwell

  site-url: https://joehalliwell.com
  google-analytics: "G-7CDJ5Z8MGP"

  search: false

execute:
  cache: true

format:
  html:
    theme:
      - simplex
      - styles.scss
    # toc: true
    # toc-location: left
    # Lets Mastodon verify the link on the profile at the other end. It fetches
    # whichever URL the profile names, so this goes on every page rather than
    # just the about page.
    include-in-header:
      text: |
        <link rel="me" href="https://mastodon.social/@joehalliwell" />
